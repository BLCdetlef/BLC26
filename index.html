<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Digitale, interaktive Fassung des BRUCHLASTcharts.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>BRUCHLASTchart – digitale Arbeitsfassung</title>
  <link rel="stylesheet" href="style.css?v=0.6.0">
</head>
<body>
  <main class="app-shell" id="appShell">
    <h1 class="brand-watermark"><span class="brand-name">BRUCHLAST</span><span class="brand-chart">chart</span></h1>
    <section class="chart-shell" aria-label="BRUCHLASTchart Zeitdiagramm">
      <div id="chart" class="chart" aria-label="Zeitreihen des BRUCHLASTcharts"></div>
      <output id="seriesCount" class="status" aria-live="polite">Import wird geprüft …</output>
      <div id="importStatus" class="import-status" role="status" aria-live="polite">Lokales Übergabepaket wird geladen und verifiziert.</div>
    </section>
    <aside id="legendPanel" class="side-panel side-panel-right" aria-labelledby="legendTitle" aria-hidden="true" inert>
      <div class="panel-heading"><div><span class="panel-kicker">Diagramm</span><h2 id="legendTitle">Legende</h2></div><button class="panel-close" type="button" data-close-panel="legendPanel" aria-label="Legende schließen">×</button></div>
      <div id="legendContent" class="panel-content"></div>
    </aside>
    <button id="legendHandle" class="panel-handle panel-handle-right" type="button" aria-controls="legendPanel" aria-expanded="false"><span>Legende</span></button>
    <aside id="filterPanel" class="side-panel side-panel-left" aria-labelledby="filterTitle" aria-hidden="true" inert>
      <div class="panel-heading"><div><span class="panel-kicker">Kurvenauswahl</span><h2 id="filterTitle">Filter</h2></div><button class="panel-close" type="button" data-close-panel="filterPanel" aria-label="Filter schließen">×</button></div>
      <div id="filterContent" class="panel-content"></div>
    </aside>
    <button id="filterHandle" class="panel-handle panel-handle-left" type="button" aria-controls="filterPanel" aria-expanded="false"><span>Filter</span></button>
    <button id="panelBackdrop" class="panel-backdrop" type="button" aria-label="Geöffneten Bereich schließen" hidden></button>
  </main>
  <div class="orientation-notice" role="status"><span class="orientation-icon" aria-hidden="true">↻</span><strong>Bitte ins Querformat drehen</strong><span>Das BRUCHLASTchart nutzt die gesamte Breite des Displays.</span></div>

  <script src="data.js?v=0.6.0"></script>
  <script src="events.js?v=0.6.0"></script>
  <script src="reference.js?v=0.6.0"></script>
  <script src="app.js?v=0.6.0"></script>
</body>
</html>
